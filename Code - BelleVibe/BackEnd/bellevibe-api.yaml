            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoriqueEntry'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsInvalides'

  /historique/historique:
    get:
      tags: [Historique]
      summary: Historique de l'employé logged in
      description: >
        Retourne uniquement les actions de l'employé actuellement connecté
        (filtré par le token). 
      responses:
        '200':
          description: Historique de l'employé connecté
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoriqueEntry'
        '401':
          description: Non authentifié
        '404':
          description: Employé non trouvée
