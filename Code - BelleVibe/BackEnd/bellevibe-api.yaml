  /documents/{idDossier}/file:
    post:
      tags: [Documents]
      summary: Uploader un document
      description: >
        Ajoute un fichier au dossier via multipart/form-data.
        Le fichier est stocké dans BD/uploads/{idDossier}/ avec un nom basé sur le timestamp.
        
      parameters:
        - name: idDossier
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fichier]
              properties:
                fichier:
                  type: string
                  format: binary
                  description: Fichier à uploader — champ form-data nommé "fichier".
      responses:
        '201':
          description: Document uploadé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Document ajouté avec succès.
                  idDocument:
                    type: integer
                    example: 3
        '400':
          description: Champs manquants ou invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '401':
          description: Non authentifié

  /documents/{idDocument}/file:
    put:
      tags: [Documents]
      summary: Remplacer un document
      description: >
        Remplace le fichier existant par un nouveau. L'ancien fichier est supprimé
        du serveur après la mise à jour en base de données.
        idDossier est requis dans le body (form-data).
        
      parameters:
        - name: idDocument
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fichier, idDossier]
              properties:
                fichier:
                  type: string
                  format: binary
                idDossier:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Document remplacé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Champs manquants ou invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '401':
          description: Non authentifié
        '404':
          description: Document non trouvé (nouveau fichier supprimé automatiquement)

