openapi: 3.0.3
info:
  title: BelleVibe API
  description: >
    API de gestion interne pour BelleVibe. Couvre la gestion des employés,
    clients, dossiers, demandes, notes, documents, forfaits, services et
    l'historique des actions.


    ### Authentification

    Toutes les routes (sauf `/employes/login`) requièrent un token JWT passé
    dans le header `Authorization: Bearer <token>`.
    Le token expire après **2 heures**.

  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Serveur local de développement

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── Réponses génériques ──────────────────────────────────────────────────
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Opération effectuée avec succès.

    ChampManquant:
      type: object
      properties:
        error:
          type: string
          example: Champs manquants

    PWInvalide:
      type: object
      properties:
        error:
          type: string
          example: Mot de passe invalide

    PermissionsInvalides:
      type: object
      properties:
        error:
          type: string
          example: Accès refusé. Permissions manquantes.

    # ── Auth ─────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, mdp]
      properties:
        email:
          type: string
          format: email
          example: employe@bellevibe.com
        mdp:
          type: string
          example: "123456789"

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: connexion réussie & sécurisée
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    # ── Employé ──────────────────────────────────────────────────────────────
    EmployeCreate:
      type: object
      required: [role, nom, prenom, courriel, telephone, adresse, codePostal, mdp]
      properties:
        role:
          type: string
          enum: [admin, superviseur, commis]
          example: superviseur
        nom:
          type: string
          example: St-Pierre
        prenom:
          type: string
          example: George
        courriel:
          type: string
          format: email
          example: superviseur@bellevibe.com
        telephone:
          type: string
          example: "9876543210"
        adresse:
          type: string
          example: 1e avenue
        codePostal:
          type: string
          example: A1B2C3
        mdp:
          type: string
          description: Mot de passe en clair — sera haché (bcrypt) avant stockage.
          example: "123456789"

    EmployeResponse:
      type: object
      properties:
        idEmploye:
          type: integer
          example: 7
        roleEmploye:
          type: string
          enum: [admin, superviseur, commis]
          example: superviseur
        statutEmploye:
          type: string
          enum: [actif, inactif]
          example: actif
        nomEmploye:
          type: string
          example: St-Pierre
        prenomEmploye:
          type: string
          example: George
        courrielEmploye:
          type: string
          format: email
          example: superviseur@bellevibe.com
        telephoneEmploye:
          type: string
          example: "9876543210"
        adresseEmploye:
          type: string
          example: 1e avenue
        codePostalEmploye:
          type: string
          example: A1B2C3

    EmployeUpdate:
      type: object
      required: [nom, prenom, courriel, telephone, adresse, codePostal]
      properties:
        nom:
          type: string
          example: Hanachian
        prenom:
          type: string
          example: Alek
        courriel:
          type: string
          format: email
          example: alek.h@bellevibe.com
        telephone:
          type: string
          example: "4501234567"
        adresse:
          type: string
          example: 2e avenue
        codePostal:
          type: string
          example: A1B2C3

    EmployeAdminUpdate:
      type: object
      required: [role, statut, mdp]
      description: Modification des données sensibles — admin seulement.
      properties:
        role:
          type: string
          enum: [admin, superviseur, commis]
          example: commis
        statut:
          type: string
          enum: [actif, inactif]
          example: actif
        mdp:
          type: string
          description: Nouveau mot de passe en clair — sera re-haché.
          example: "nouveaumdp456"

    # ── Client ───────────────────────────────────────────────────────────────
    ClientBody:
      type: object
      required: [nomClient, prenomClient, courrielClient, adresseClient, codePostalClient]
      properties:
        nomClient:
          type: string
          example: Tremblay
        prenomClient:
          type: string
          example: Jean
        courrielClient:
          type: string
          format: email
          example: jean.tremblay@example.com
        telephoneClient:
          type: string
          description: Optionnel — non soumis à validerChamps.
          example: "5141234567"
        adresseClient:
          type: string
          example: 123 rue Principale
        codePostalClient:
          type: string
          example: H1A 1A1

    ClientResponse:
      allOf:
        - $ref: '#/components/schemas/ClientBody'
        - type: object
          properties:
            idClient:
              type: integer
              example: 1

    # ── Dossier ──────────────────────────────────────────────────────────────
    DossierCreate:
      type: object
      required: [idClient, idEmploye, typeDossier, statutDossier, soldeDossier]
      properties:
        idClient:
          type: integer
          example: 1
        idEmploye:
          type: integer
          example: 5
        typeDossier:
          type: string
          example: Personnel
        statutDossier:
          type: string
          example: Actif
        soldeDossier:
          type: number
          format: float
          description: Peut être 0 — validé séparément de validerChamps.
          example: 1500.00

    DossierResponse:
      allOf:
        - $ref: '#/components/schemas/DossierCreate'
        - type: object
          properties:
            idDossier:
              type: integer
              example: 3

    DossierStatutUpdate:
      type: object
      required: [statutDossier]
      properties:
        statutDossier:
          type: string
          example: En attente

    # ── Demande ──────────────────────────────────────────────────────────────
    DemandeCreate:
      type: object
      required: [typeDemande, statutDemande, noteInterne]
      properties:
        typeDemande:
          type: string
          example: Installation
        statutDemande:
          type: string
          enum: [En attente, Ouverte, En retard, Fermée]
          example: En attente
        noteInterne:
          type: string
          example: Première installation chez le client.

    DemandeResponse:
      allOf:
        - $ref: '#/components/schemas/DemandeCreate'
        - type: object
          properties:
            idDemande:
              type: integer
              example: 5
            idDossier:
              type: integer
              example: 3

    DemandeUpdate:
      type: object
      required: [typeDemande, statutDemande, noteInterne]
      description: >
        Modifie la première demande trouvée pour l'idDossier donné.
        Tous les champs sont obligatoires.
      properties:
        typeDemande:
          type: string
          example: Support
        statutDemande:
          type: string
          enum: [En attente, Ouverte, En retard, Fermée]
          example: Ouverte
        noteInterne:
          type: string
          example: Mise à jour suite à l'appel du client.

    # ── Note ─────────────────────────────────────────────────────────────────
    NoteCreate:
      type: object
      required: [idEmploye, type, titre, note]
      properties:
        idEmploye:
          type: integer
          example: 1
        type:
          type: string
          description: Stocké dans la colonne typeNote.
          example: Suivi
        titre:
          type: string
          description: Stocké dans la colonne titreNote.
          example: Appel client
        note:
          type: string
          example: Le client a confirmé le rendez-vous.

    NoteResponse:
      allOf:
        - $ref: '#/components/schemas/NoteCreate'
        - type: object
          properties:
            idNote:
              type: integer
              example: 10
            idDossier:
              type: integer
              example: 1

    NoteUpdate:
      type: object
      required: [idDossier, idEmploye, type, titre, note]
      properties:
        idDossier:
          type: integer
          example: 1
        idEmploye:
          type: integer
          example: 1
        type:
          type: string
          example: Suivi
        titre:
          type: string
          example: Mise à jour
        note:
          type: string
          example: Contenu modifié.

    # ── Document ─────────────────────────────────────────────────────────────
    DocumentResponse:
      type: object
      properties:
        idDocument:
          type: integer
          example: 2
        idDossier:
          type: integer
          example: 1
        typeDocument:
          type: string
          description: Extension du fichier (ex. .pdf, .png). Retourne la valeur en majuscules sans point.
          example: .pdf
        tailleDocument:
          type: integer
          description: Taille en octets.
          example: 204800
        nomDocument:
          type: string
          example: contrat.pdf
        cheminDocument:
          type: string
          description: Chemin relatif sur le serveur.
          example: BD/uploads/1/2026-03-28-14-23-45-123.pdf

    # ── Service ──────────────────────────────────────────────────────────────
    ServiceCreate:
      type: object
      required: [typeService]
      properties:
        typeService:
          type: string
          example: Téléphone

    ServiceResponse:
      allOf:
        - $ref: '#/components/schemas/ServiceCreate'
        - type: object
          properties:
            idService:
              type: integer
              example: 1

    # ── Forfait ──────────────────────────────────────────────────────────────
    ForfaitCreate:
      type: object
      required: [idService, nomForfait, prixForfait, descriptionForfait]
      properties:
        idService:
          type: integer
          example: 1
        nomForfait:
          type: string
          example: Forfait Standard
        prixForfait:
          type: number
          format: float
          example: 299.99
        descriptionForfait:
          type: string
          example: Forfait incluant installation et support de base.

    ForfaitResponse:
      allOf:
        - $ref: '#/components/schemas/ForfaitCreate'
        - type: object
          properties:
            idForfait:
              type: integer
              example: 1

    # ── ForfaitDossier ───────────────────────────────────────────────────────
    ForfaitDossierCreate:
      type: object
      required: [idDossier, idForfait]
      properties:
        idDossier:
          type: integer
          example: 2
        idForfait:
          type: integer
          example: 1

    ForfaitDossierResponse:
      allOf:
        - $ref: '#/components/schemas/ForfaitDossierCreate'
        - type: object
          properties:
            idForfaitDossier:
              type: integer
              example: 5

    # ── Historique ───────────────────────────────────────────────────────────
    HistoriqueEntry:
      type: object
      properties:
        idHistorique:
          type: integer
          example: 42
        idEmploye:
          type: integer
          example: 3
        typeAction:
          type: string
          enum: [WRITE, EDIT, DELETE, UPDATE]
          example: WRITE
        tableAffectee:
          type: string
          example: DOSSIERS
        idLigne:
          type: integer
          example: 7
        dateAction:
          type: string
          format: date-time
          example: "2026-03-28T14:23:45Z"

security:
  - bearerAuth: []

tags:
  - name: Authentification
    description: Obtenir un token
  - name: Employés
    description: "Gestion des employés — authentifierSupp ou authentifierAdmin selon la route"
  - name: Clients
    description: "Gestion des clients — création et modification authentifier, suppression authentifierSupp"
  - name: Dossiers
    description: Gestion des dossiers (suppression réservée aux superviseurs)
  - name: Demandes
    description: Gestion des demandes liées aux dossiers
  - name: Notes
    description: Notes internes par dossier (suppression réservée aux admins)
  - name: Documents
    description: Fichiers uploadés par dossier (suppression réservée aux admins)
  - name: Services
    description: "Gestion des types de service — lecture authentifier, écriture authentifierAdmin"
  - name: Forfaits
    description: "Gestion des forfaits liés aux services — lecture authentifier, écriture authentifierAdmin"
  - name: ForfaitsDossier
    description: "Association forfaits et dossiers — lecture authentifier, écriture authentifierSupp"
  - name: Historique
    description: Historique des actions enregistrées automatiquement

paths:

  # ══════════════════════════════════════════════
  # AUTHENTIFICATION
  # ══════════════════════════════════════════════
  /employes/login:
    post:
      tags: [Authentification]
      summary: Connexion
      description: >
        Authentifie un employé et retourne un token.<br>
        Comptes de test disponibles:<br><br>
        commis - employe@bellevibe.com / 123456<br>
        superviseur - superviseur@bellevibe.com / 123456789 <br>
        admin - admin@bellevibe.com / 123456789 <br>
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Champs manquants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '401':
          description: Mot de passe invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PWInvalide'

  # ══════════════════════════════════════════════
  # EMPLOYÉS
  # ══════════════════════════════════════════════
  /employes/employes:
    get:
      tags: [Employés]
      summary: Lister tous les employés
      description: Retourne tous les employés avec leurs informations. Superviseur ou admin requis.
      responses:
        '200':
          description: Liste des employés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeResponse'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsInvalides'

  /employes/addEmploye:
    post:
      tags: [Employés]
      summary: Créer un employé
      description: >
        Ajoute un nouvel employé. Le statut est automatiquement défini à actif.
        Le mot de passe est haché avant stockage.
        Superviseur ou admin requis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeCreate'
      responses:
        '201':
          description: Employé créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeResponse'
        '400':
          description: Champs manquants ou invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsInvalides'

  /employes/adminEdit/{idEmploye}:
    put:
      tags: [Employés]
      summary: Modifier les données sensibles d'un employé
      description: >
        Modifie le rôle, le statut et le mot de passe d'un employé.
        Le mot de passe est re-haché avant stockage.
        Admin seulement.
      parameters:
        - name: idEmploye
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeAdminUpdate'
      responses:
        '200':
          description: Données sensibles mises à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Champs manquants ou invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsInvalides'
        '404':
          description: Employé non trouvé

  /employes/{idEmploye}:
    put:
      tags: [Employés]
      summary: Modifier les infos de base d'un employé
      description: >
        Modifie nom, prénom, courriel, téléphone, adresse et code postal.
        Ne modifie pas le mot de passe, le rôle ni le statut.
        Superviseur ou admin requis.
      parameters:
        - name: idEmploye
          in: path
          required: true
          schema:
            type: integer
          example: 7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeUpdate'
      responses:
        '200':
          description: Infos mises à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Champs manquants ou invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsInvalides'
        '404':
          description: Employé non trouvé

    delete:
      tags: [Employés]
      summary: Supprimer un employé
      description: Supprime définitivement un employé. Admin seulement.
      parameters:
        - name: idEmploye
          in: path
          required: true
          schema:
            type: integer
          example: 8
      responses:
        '200':
          description: Employé supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: idEmploye manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsInvalides'
        '404':
          description: Employé non trouvé

  # ══════════════════════════════════════════════
  # CLIENTS
  # ══════════════════════════════════════════════
  /clients/getClients:
    get:
      tags: [Clients]
      summary: Lister tous les clients
      description: Retourne tous les clients.
      responses:
        '200':
          description: Liste des clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientResponse'
        '401':
          description: Non authentifié

  /clients/getClient/{idClient}:
    get:
      tags: [Clients]
      summary: Obtenir un client
      description: Retourne un client spécifique. 
      parameters:
        - name: idClient
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Données du client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: idClient manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '401':
          description: Non authentifié
        '404':
          description: Client non trouvé

  /clients/creerClient:
    post:
      tags: [Clients]
      summary: Créer un client
      description: >
        Crée un nouveau client. telephoneClient est optionnel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientBody'
      responses:
        '201':
          description: Client créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Client créé avec succès.
                  idClient:
                    type: integer
                    example: 4
        '400':
          description: Champs manquants ou invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '401':
          description: Non authentifié

  /clients/modifierClient/{idClient}:
    put:
      tags: [Clients]
      summary: Modifier un client
      description: Modifie toutes les informations d'un client. 
      parameters:
        - name: idClient
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientBody'
      responses:
        '200':
          description: Client modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Champs manquants ou invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '404':
          description: Client non trouvé

  /clients/supprimerClient/{idClient}:
    delete:
      tags: [Clients]
      summary: Supprimer un client
      description: Supprime un client. Superviseur ou admin requis.
      parameters:
        - name: idClient
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Client supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: idClient manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '403':
          description: Accès refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsInvalides'
        '404':
          description: Client non trouvé

  # ══════════════════════════════════════════════
  # DOSSIERS
  # ══════════════════════════════════════════════
  /dossiers/getDossiers:
    get:
      tags: [Dossiers]
      summary: Lister tous les dossiers
      description: Retourne tous les dossiers. 
      responses:
        '200':
          description: Liste des dossiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DossierResponse'
        '401':
          description: Non authentifié

  /dossiers/getDossier/{idDossier}:
    get:
      tags: [Dossiers]
      summary: Obtenir un dossier
      description: Retourne un dossier spécifique. 
      parameters:
        - name: idDossier
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Données du dossier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierResponse'
        '400':
          description: idDossier manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '401':
          description: Non authentifié
        '404':
          description: Dossier non trouvé

  /dossiers/dossiersAttente:
    get:
      tags: [Dossiers]
      summary: Lister les dossiers en attente
      description: >
        Retourne les dossiers en attente. 

        Note: La condition SQL actuelle (where "en attente") est probablement
        incorrecte et doit être corrigée côté backend.
      responses:
        '200':
          description: Liste des dossiers en attente
        '401':
          description: Non authentifié

  /dossiers/creerDossier:
    post:
      tags: [Dossiers]
      summary: Créer un dossier
      description: >
        Crée un dossier associé à un client et un employé existant.
        soldeDossier peut être 0 mais ne peut pas être absent.
        
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierCreate'
      responses:
        '201':
          description: Dossier créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierResponse'
        '400':
          description: Champs manquants ou invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampManquant'
        '401':
